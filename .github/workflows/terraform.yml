name: "Terraform CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform:
    name: "Terraform Validate & Apply"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./aws_infra

    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: mock_access_key
      AWS_SECRET_ACCESS_KEY: mock_secret_key
      AWS_DEFAULT_REGION: us-east-1
      AWS_PAGER: ""

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Iniciar LocalStack (com debug)
        run: |
          docker compose up -d
          docker compose ps
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          DEBUG: "1"
          LS_LOG: "trace"

      - name: Aguardar o LocalStack
        timeout-minutes: 3
        run: |
          echo "Aguardando o LocalStack iniciar..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:4566/_localstack/init/ready | grep -q '"completed": *true'; then
              echo "LocalStack pronto!"
              echo "--- Health ---"
              curl -s http://localhost:4566/_localstack/health
              exit 0
            fi
            echo "Tentativa $i/40: ainda não está pronto..."
            sleep 3
          done
          echo "ERRO: LocalStack não ficou pronto."
          docker compose ps
          docker compose logs --no-color --timestamps
          exit 1

      - name: Criar S3 Bucket no LocalStack
        timeout-minutes: 2
        run: |
          timeout 60 aws --endpoint-url=http://localhost:4566 s3 mb s3://renato-terraform-state

      - name: Criar DynamoDB Table no LocalStack (debug)
        timeout-minutes: 6
        run: |
          echo "--- Health antes do DynamoDB ---"
          curl -s http://localhost:4566/_localstack/health
          echo

          echo "--- Streaming dos logs do LocalStack em background ---"
          docker compose logs -f --no-color --timestamps localstack &
          LOGS_PID=$!

          echo "--- Criando tabela ---"
          aws --debug \
            --cli-connect-timeout 10 --cli-read-timeout 240 \
            --endpoint-url=http://localhost:4566 \
            dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST 2>&1 | tee /tmp/ddb-create.log
          RC=${PIPESTATUS[0]}

          kill $LOGS_PID 2>/dev/null || true
          exit $RC

      - name: Configurar a Ferramenta Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init (debug em arquivo)
        timeout-minutes: 5
        run: terraform init -input=false -no-color
        env:
          TF_LOG: DEBUG
          TF_LOG_PATH: ${{ runner.temp }}/terraform-init-debug.log

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -input=false

      - name: Terraform Apply (Execução Automática na Main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

      # ---------- Diagnóstico: sempre roda ----------
      - name: "[DEBUG] Estado dos containers e health"
        if: always()
        run: |
          docker compose ps -a || true
          curl -s http://localhost:4566/_localstack/health || true
          echo
          curl -s http://localhost:4566/_localstack/diagnose || true

      - name: "[DEBUG] Logs do LocalStack"
        if: always()
        run: docker compose logs --no-color --timestamps localstack || docker compose logs --no-color --timestamps || true

      - name: "[DEBUG] Últimas linhas do log do Terraform"
        if: always()
        run: tail -n 150 "${{ runner.temp }}/terraform-init-debug.log" || true

      - name: "[DEBUG] Upload dos logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            ${{ runner.temp }}/terraform-init-debug.log
            /tmp/ddb-create.log
          if-no-files-found: ignore